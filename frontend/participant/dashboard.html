<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participant Portal - TechNova</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .portal-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 600px;
            margin: 10vh auto;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f8fafc;
        }
        .status-badge {
            display: inline-block;
            padding: 0.5rem 1.25rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            margin: 1rem 0 1.5rem 0;
        }
        .status-badge.not-started {
            background: rgba(234, 179, 8, 0.15);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, 0.3);
        }
        .status-badge.started {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .event-title {
            color: #6366f1;
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }
        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="portal-card">
            <h2 id="portal-heading" style="font-size: 1.8rem; margin-bottom: 0.5rem;">Events are not started yet</h2>
            <div id="event-name" class="event-title"></div>
            <div id="status-badge" class="status-badge not-started">Status: Not Started</div>
            
            <p id="portal-message" style="color: #94a3b8; line-height: 1.6;">
                You have successfully logged in! However, the administrator has not started this event yet. Please check back when the competition officially begins.
            </p>

            <div class="btn-group">
                <button onclick="window.location.reload()" class="submit-btn" style="width: auto; padding: 0.75rem 1.5rem;">↻ Refresh Status</button>
                <button onclick="logoutParticipant()" class="submit-btn" style="width: auto; padding: 0.75rem 1.5rem; background: #64748b;">Logout</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('participantToken');
            if (!token) {
                window.location.href = '/participant/login.html';
                return;
            }

            const eventName = localStorage.getItem('participantEventName') || 'Registered Event';
            const eventStatus = localStorage.getItem('participantEventStatus') || 'Not Started';

            const heading = document.getElementById('portal-heading');
            const eventTitleEl = document.getElementById('event-name');
            const badgeEl = document.getElementById('status-badge');
            const messageEl = document.getElementById('portal-message');

            eventTitleEl.textContent = `Event: ${eventName}`;

            if (eventStatus === 'Started') {
                heading.textContent = 'Welcome Participant!';
                badgeEl.textContent = '● Status: Live / Started';
                badgeEl.className = 'status-badge started';
                messageEl.textContent = `Your event "${eventName}" is now live! The competition environment is ready for you.`;
            } else {
                heading.textContent = 'Events are not started yet';
                badgeEl.textContent = '⏳ Status: Not Started';
                badgeEl.className = 'status-badge not-started';
                messageEl.textContent = `You have successfully logged in to "${eventName}". However, this event has not been started by the administrator yet. Please wait for the event to begin.`;
            }
        });

        function logoutParticipant() {
            localStorage.removeItem('participantToken');
            localStorage.removeItem('participantEventName');
            localStorage.removeItem('participantEventStatus');
            window.location.href = '/participant/login.html';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - TechNova</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .dashboard-container { padding: 2rem; max-width: 1200px; margin: 0 auto; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .stat-card { background: var(--bg-card); padding: 1.5rem; border-radius: 8px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .stat-number { font-size: 2.5rem; font-weight: 700; color: var(--primary); margin-top: 0.5rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { background: rgba(0,0,0,0.2); font-weight: 600; color: var(--text-muted); }
        tr:hover { background: rgba(255,255,255,0.02); }
        .logout-btn { background: var(--error); color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        .event-status-btn { padding: 0.4rem 0.8rem; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .status-started { background: var(--success); color: white; }
        .status-not-started { background: #64748b; color: white; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h2>Admin Dashboard</h2>
            <button id="logout-btn" class="logout-btn">Logout</button>
        </header>

        <section>
            <h3>Registration Statistics</h3>
            <div class="stats-grid" id="stats-container">
                <!-- Stats injected here -->
                <div class="stat-card">Loading stats...</div>
            </div>
        </section>

        <section style="margin-bottom: 3rem;">
            <h3>Event Management</h3>
            <div style="overflow-x: auto;">
                <table id="events-table">
                    <thead>
                        <tr>
                            <th>Event Name</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Events injected here -->
                    </tbody>
                </table>
            </div>
        </section>

        <section>
            <h3>Registered Participants</h3>
            <div style="overflow-x: auto;">
                <table id="participants-table">
                    <thead>
                        <tr>
                            <th>Participant ID</th>
                            <th>Name</th>
                            <th>College</th>
                            <th>Email</th>
                            <th>Event</th>
                            <th>Registered At</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Participants injected here -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="../js/admin-dashboard.js"></script>
</body>
</html>
